<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid introduction</title>
    <style>
      body {
        font-weight: bold;
        font-size: 30px;
        background-color: #7705b4;
      }
      .grid-container {
        display: grid;

        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 100px 200px 100px;
        gap: 5px;
      }
      .item {
        background-color: orange;
        border: 3px solid black;
      }
      .item1 {
        grid-column: 1/3;
        grid-row: 1/2;
      }
      .item2 {
        grid-column: 3/4;
        grid-row: 1/3;
      }
      .item6 {
        grid-column: 2/4;
        border: 6px solid red;
      }
      .item3 {
        border: 3px solid #e1dcdc;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="item item1" style="background-color: brown">1</div>
      <div class="item item2">2</div>
      <div class="item item3">
        <img src="../07_grid/logo chai.jpeg" alt="" height="200px" width="200px" />
      </div>

      <div class="item" srcset="">4</div>
      <div class="item">5</div>
      <div class="item item6" style="background-color: grey">6</div>
    </div>
  </body>
