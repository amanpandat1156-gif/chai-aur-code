<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-gray-900 flex justify-center items-center min-h-screen ">

    <h2 class="text-center text-3xl text-white mb-6 font-bold">Login</h2>
    <form> 
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-300 font-bold mb-2 text-lg underline" for="">Email</label>
            <input class="w-full px-3 py-2 bg-gray-900 border-gray-600 rounded-md text-white focus: outline-none focus:ring-2 focus:ring-blue-500 " type="email" name="" placeholder="Email" id="">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-300 font-bold mb-2 text-lg underline" for="">Password</label>
            <input class="w-full px-3 py-2 bg-gray-900 border-gray-600 rounded-md text-white focus: outline-none focus:ring-2 focus:ring-blue-500 "  type="password" name="" placeholder="password" id="">
        </div>
        <button class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-700 shadow-2xl shadow-blue-900" type="submit">Login</button>
    </div>
    </form>
</body>
