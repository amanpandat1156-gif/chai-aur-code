<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup page</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace ;
            background-color: black;
            height: 100vh;
            margin:0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
         }
         .signup{
            background-color: rgb(112, 66, 66);
            padding: 7px;;
            width: 450px;
         }
         h1{
            color: rgb(8, 7, 7);
            text-align: center;
            margin-bottom: 10px;
         }
         form{
            display: flex;
            flex-direction: column;
            gap: 2px;
             
         }
         input{
            margin-bottom: 1px;
            padding: 10px;
border-radius: 99px;
border: 9px solid rgb(0, 0, 0);
background-color: #3e3535;

         }
         .name-box{
            display: flex;
            justify-content: center;
         }
         .name-box input{
            width: 140px;

         }
         button{
            background-color: rgb(17, 94, 130);
            color: rgb(0, 1, 0);
            background-color: rgb(179, 142, 142);
            size-adjust: 60px;
            height: 25px;
         }

    </style>
</head>
<body>
    <div class="signup"> 
        <h1>signup</h1>
        <form>
            <input type="email" name"" id=""placeholder="Email :"/>
            <input type="first name"placeholder="First name :"/>
            <input type="last name"placeholder="Last name :"/>
            <input type="Password" name="" id=""placeholder="Password :">
            <button type="signup"> signup</button>
        </form>
    </div>
</body>
</html>
