<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar Variations</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        color: aliceblue;
        
      }
      .nav-container{
        margin-bottom: 40px;
        }
        h2{
          margin-bottom: 20px;
        }
        .nav1{
          border: 2px solid rgb(13, 63, 229);
          background-color: rgb(225, 232, 232);
          border-radius: 5px;
          padding: 20px;
          
        }
       
        .nav1 ul{
          list-style-type: none;
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: space-between;
          
        }
        .nav1 li{
          display: inline;
        }
        .nav1 a{
          text-decoration: none;
          color: #030101;
           
           padding: 5px 10px;
           position: relative;
           }
           .nav1 a::after{
          content: "aman";
          position:  absolute;
          height: 2px;
          width: 100%;
          bottom: 0;
          left: 0;
          background-color: #5e0de0;
          transform: scaleX(0);
          transition: transform 0.3s ease-in-out;
        }
        .nav1 a:hover::after{
          transform: scaleX(1);
        }
           
           .nav1 button{
            background-color: #5e0de0;
            color: #f0ebeb;
            border:none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
           }

.nav2{
  border: 3px solid rgb(238, 237, 233);
  background-color: #13481d;
  width: 200px;
  padding: 20px;
}
.nav2 ul{
  list-style-type: none;
  padding: 0;
  margin: 0;
}
.nav2 li{
  margin-bottom: 12px;
}
.nav2 a{
  text-decoration: none;
  color: aliceblue;
  display: block;
  padding: 10px;
  width: 100%;
}
.nav2 a:hover{
  background-color: #28cba2;
}
.nav2 button{
background-color: #1c902c;
            color: #f0ebeb;
            border:none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
            margin-left: 9px;
            
           }
           .nav2 button:hover{
            background-color: #065a2c;
            border: 1px solid white;
           }


          
          

   
          
          
           .nav3{
            border: 3px solid #4307ce;
            background-color: #0eadc2;
            padding: 10px;
            
          }
          .nav3 ul{
            list-style-type:none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
          }
          .nav3 a{
            text-decoration: none;
            color: #18057b;
            padding: 10px;
            display: block;

          }
          .nav3 .dropdown-content{
            display: none;
          }
          .nav3 .dropdown:hover .dropdown-content{
            display: block;
            position:absolute;
            background-color: #50646a;
            min-width: 150px;

          }
         .nav3 .dropdown-content a{
          position: relative;
         }
         
         .nav3 .dropdown-content a::after{
          content: "wow";
          position:  absolute;
          height: 4px;
          width: 100%;
          bottom: 0;
          left: 0;
          background-color: #e24908;
          transform: scaleX(0);
          transition: transform 0.5s ease-in-out;
        }
        .nav3 .dropdown-content a:hover::after{
          transform: scaleX(1);
        }
        


         </style>
    
  </head>

 <body>
    <div class="nav_container">
      <h2>variation 1:Horizontal with underline effect</h2>
      <nav class="nav1">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <button class="login-btn">Login</button>

        </div>

          
 <div class="nav_container">
  <h2>variation 2:Vertical with hover effect </h2>
 <nav class="nav2">
  <ul>
   <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Products</a></li>
          <button class="login-btn">Login</button>


  </div>

  <div class="nav_container"> <h2>variation 3:Horizontal with dropdown </h2>
 <nav class="nav3">
        <ul>
          <li><a href="#">Home</a></li>
          <li class="dropdown">

          <a href="#">About</a>
          <div class="dropdown-content">
          <a href="#">Our Story</a>
          <a href="#">Team</a>
          <a href="#">Contact</a>
         </div>
        </li>
          <li><a href="#">Products</a></li>
         
          <button class="login-btn">Login</button>
          
        </ul>
      </nav>
    </div>
  </body>
</html>
